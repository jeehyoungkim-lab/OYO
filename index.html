<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="./manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이승원 성경 암송</title>
    <style>
        :root {
            --bg-color: #0b1a14; /* 짙은 밤 녹색 배경 */
            --card-bg: #142a21; /* 아코디언 카드 배경 */
            --card-hover: #1d3b2f; /* 호버/선택 시 배경 */
            --border-color: #234537; /* 테두리 색상 */
            --text-main: #e1efe6; /* 본문 글자 (눈이 편안한 오프화이트) */
            --text-sub: #9eb8a8; /* 보조 글자 (차분한 쑥색) */
            --accent-main: #6edcc4; /* 큰 주제 & 구절 장절 포인트 */
            --accent-sub: #a8e6cf; /* 소주제 포인트 */
        }
        * {
            box-sizing: border-box;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif;
            margin: 0 auto;
            padding: 24px 16px;
            max-width: 640px;
            line-height: 1.7;
            word-break: keep-all;
        }
        header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }
        h1 {
            font-size: 1.5rem;
            color: var(--accent-main);
            margin: 0 0 6px 0;
            letter-spacing: -0.5px;
        }
        p.subtitle {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin: 0;
        }

        /* 오늘의 암송 구절 섹션 */
        .random-section {
            background-color: rgba(110, 220, 196, 0.06);
            border: 1px dashed var(--accent-main);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 28px;
            text-align: center;
        }
        .random-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-sub);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        .random-card {
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .random-ref {
            font-weight: 700;
            font-size: 1rem;
            color: var(--accent-main);
            margin-bottom: 6px;
        }
        .random-text {
            font-size: 0.95rem;
            color: var(--text-main);
            margin: 0 0 14px 0;
            max-width: 500px;
        }
        .random-btn {
            background-color: var(--card-bg);
            color: var(--accent-main);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .random-btn:hover {
            background-color: var(--card-hover);
            border-color: var(--accent-main);
        }

        /* 대주제 아코디언 */
        details.main-topic {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 14px;
            overflow: hidden;
            transition: background-color 0.2s ease;
        }
        details.main-topic[open] {
            border-color: var(--accent-main);
        }
        summary.main-summary {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-main);
            padding: 16px;
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        summary.main-summary::-webkit-details-marker {
            display: none;
        }
        summary.main-summary::after {
            content: '▶';
            font-size: 0.8rem;
            color: var(--text-sub);
            transition: transform 0.2s ease;
        }
        details[open] > summary.main-summary::after {
            transform: rotate(90deg);
            color: var(--accent-main);
        }
        .main-content {
            padding: 0 12px 14px 12px;
        }
        /* 소주제 아코디언 */
        details.sub-topic {
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-top: 10px;
        }
        summary.sub-summary {
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent-sub);
            padding: 12px 14px;
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        summary.sub-summary::-webkit-details-marker {
            display: none;
        }
        summary.sub-summary::after {
            content: '＋';
            font-size: 0.9rem;
            color: var(--text-sub);
        }
        details[open] > summary.sub-summary::after {
            content: '－';
            color: var(--accent-sub);
        }
        /* 구절 카드 */
        .verse-list {
            padding: 8px 12px 12px 12px;
        }
        .verse-card {
            background-color: var(--card-bg);
            border-left: 3px solid var(--accent-main);
            border-radius: 0 6px 6px 0;
            padding: 12px 14px;
            margin-top: 10px;
        }
        .verse-ref {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--accent-main);
            margin-bottom: 6px;
        }
        .verse-text {
            font-size: 0.95rem;
            color: var(--text-main);
            margin: 0;
            white-space: pre-line;
        }
        /* 하단 안내 */
        footer {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 32px;
        }
    </style>
</head>
<body>

    <header>
        <h1>이승원 성경 암송</h1>
        <p class="subtitle">나의 삶을 움직이는 성경 암송 구절</p>
    </header>

    <!-- 오늘의 암송 구절 랜덤 뽑기 -->ㄱ
    <section class="random-section">
        <div class="random-title">✨ 오늘의 암송 구절</div>
        <div class="random-card" id="randomCard">
            <div class="random-ref" id="randomRef">로딩 중...</div>
            <p class="random-text" id="randomText">말씀을 불러오고 있습니다.</p>
        </div>
        <button class="random-btn" onclick="getRandomVerse()">🎲 다른 구절 보기</button>
    </section>

    <main>
      
     

    </main>

    <footer>
        <p>© My Bible Memorization. All rights reserved.</p>
    </footer>

    <!-- 👇 구글 시트 실시간 연동이 적용된 스크립트입니다 -->
    <script>
        // 질문자님의 구글 시트 CSV 변환 주소 (1열: 제목, 2열: 장절, 3열: 내용)
        const sheetUrl = "https://docs.google.com/spreadsheets/d/1T5qXLng8Dv0FmtAH-j2aaf-RsMICiOvMDYWTuBDoIX0/edit?usp=sharing";
        
        // 가져온 성경 구절 데이터를 저장할 전역 배열
        let bibleVerses = [];

               // 구글 시트 데이터를 가져오는 함수
        async function fetchSheetData() {
            try {
                const response = await fetch(sheetUrl);
                if (!response.ok) throw new Error("네트워크 응답에 문제가 있습니다.");
                
                const data = await response.text();
                
                // CSV 행 단위 분리
                const rows = data.split(/\r?\n/);
                const fetchedVerses = [];

                // 첫 번째 줄(제목 행)은 건너뛰고 인덱스 1부터 시작
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i].trim();
                    if (!row) continue;

                    // 💡 [수정] CSV의 큰따옴표 규칙을 완벽하게 처리하는 파싱 로직
                    const columns = [];
                    let insideQuotes = false;
                    let currentColumn = "";

                    for (let j = 0; j < row.length; j++) {
                        const char = row[j];

                        if (char === '"') {
                            // 큰따옴표를 만나면 토글 (따옴표 안의 쉼표는 무시하기 위함)
                            insideQuotes = !insideQuotes;
                        } else if (char === ',' && !insideQuotes) {
                            // 따옴표 밖에서 만난 쉼표만 진짜 열 분리자로 인정
                            columns.push(currentColumn.trim());
                            currentColumn = "";
                        } else {
                            // 그 외의 문자(따옴표 안의 쉼표 포함)는 글자 그대로 결합
                            currentColumn += char;
                        }
                    }
                    // 맨 마지막 열 추가
                    columns.push(currentColumn.trim());

                    // 최소 3개 이상의 열(제목, 장절, 내용)이 정상 분리되었는지 확인
                    if (columns.length >= 3) {
                        const ref = columns[1];  // 2열: 장절
                        const text = columns[2]; // 3열: 내용

                        if (ref && text) {
                            fetchedVerses.push({ ref, text });
                        }
                    }
                }

                if (fetchedVerses.length > 0) {
                    bibleVerses = fetchedVerses;
                    getRandomVerse(); // 로드 완료 후 첫 구절 뽑기
                } else {
                    document.getElementById('randomRef').innerText = "데이터 오류";
                    document.getElementById('randomText').innerText = "시트에서 파싱할 수 있는 구절이 없습니다.";
                }

            } catch (error) {
                console.error("구글 시트 로드 실패:", error);
                document.getElementById('randomRef').innerText = "연동 실패";
                document.getElementById('randomText').innerText = "구글 시트 데이터를 가져오지 못했습니다.";
            }
        }

        // 화면에 무작위 구절을 띄워주는 함수
        function getRandomVerse() {
            const card = document.getElementById('randomCard');
            if (!card || bibleVerses.length === 0) return;
            
            // 자연스러운 페이드 아웃 애니메이션
            card.style.opacity = 0;
            card.style.transform = "translateY(-5px)";
            
            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * bibleVerses.length);
                const selected = bibleVerses[randomIndex];
                
                document.getElementById('randomRef').innerText = selected.ref;
                document.getElementById('randomText').innerText = selected.text;
                
                // 페이드 인 애니메이션
                card.style.opacity = 1;
                card.style.transform = "translateY(0)";
            }, 250);
        }

        // 페이지가 열리면 자동으로 구글 시트 데이터를 불러옵니다.
        window.addEventListener('DOMContentLoaded', fetchSheetData);
    </script>



    
</body>
</html>
